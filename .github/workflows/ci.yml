name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


jobs:

  backend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Ruff check
        run: |
          cd backend
          ruff check .


      - name: Run tests
        run: |
          cd backend
          pytest


  frontend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install


      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit


      - name: ESLint check
        run: |
          cd frontend
          npm run lint


      - name: Build frontend
        run: |
          cd frontend
          npm run build